# search-cli configuration
# Place at ~/.config/search/config.toml
# All keys can also be set via env vars with SEARCH_ prefix
# e.g. SEARCH_BRAVE_KEY, SEARCH_SERPER_KEY

[keys]
brave = ""
serper = ""
exa = ""
jina = ""
firecrawl = ""
tavily = ""
serpapi = ""
perplexity = ""
browserless = ""
xai = ""

[settings]
timeout = 10
count = 10
# email = "you@example.org"   # contact for Crossref/OpenAlex/Unpaywall (SEARCH_SETTINGS_EMAIL); Unpaywall is skipped without it

# [xai]
# model = "grok-4.3"   # model for X search; default grok-4.3 (SEARCH_XAI_MODEL)

# [reddit]
# How extract reads a Reddit thread (SEARCH_REDDIT_READER):
#   "index" - the search index's copy (Perplexity Search API); never contacts reddit.com
#   "jina"  - the full live thread rendered by Jina Reader, falling back to the
#             index copy. Opt-in: outside Reddit's terms for automated access.
# Unset behaves like "index" and adds extra.reader_hint offering the opt-in.
# reader = "index"
