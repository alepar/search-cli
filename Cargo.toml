[package]
name = "agent-search"
version = "0.12.2"
edition = "2024"
rust-version = "1.89"
description = "Unified multi-provider search CLI for AI agents — 14 providers, 13 modes, email verification, one binary"
license = "MIT"
repository = "https://github.com/alepar/search-cli"
homepage = "https://github.com/alepar/search-cli"
documentation = "https://github.com/alepar/search-cli#readme"
keywords = ["search", "cli", "ai-agent", "meta-search", "web-search"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "search"
path = "src/main.rs"

[features]
# Opt-in: the stealth scraper impersonates a browser's TLS fingerprint
# (wreq + BoringSSL). Building it needs cmake, clang and a C++ compiler.
default = []
stealth = ["dep:wreq", "dep:wreq-util"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
comfy-table = "7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
async-trait = "0.1"
owo-colors = "4"
indicatif = "0.18"
self_update = { version = "1.3.3", default-features = false, features = ["github", "reqwest", "rustls", "archive-tar", "compression-tar-gz", "checksums"] }
backon = "1"
url = "2.5.8"
mimalloc = "0.1.48"
simd-json = "0.17.0"
wreq = { version = "0.16.3", features = ["json", "cookies", "gzip", "brotli", "deflate", "zstd"], optional = true }
wreq-util = { version = "0.2.0", optional = true }
hickory-resolver = { version = "0.26", features = ["tokio"] }
readability = { version = "0.3", default-features = false }
roxmltree = "0.21.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
