name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The full CI suite (fmt, clippy, tests, stealth, MSRV, cargo-deny) on the
  # tagged commit. Nothing is built or published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        # --locked: reproducible release builds from the committed Cargo.lock.
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../search-${{ matrix.target }}.tar.gz search
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: search-${{ matrix.target }}
          path: search-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # One checksums file per release: install.sh and `search update`
      # verify against it instead of hand-computing hashes.
      - name: Checksums
        run: sha256sum search-*.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            search-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
